# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"

    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    groups:
      github-actions:
        patterns:
          - "*"

    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    groups:
      python-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "homeassistant"
          - "pytest-homeassistant-custom-component"
    ignore:
      # Home Assistant and its test harness are bumped together by hand: the
      # pin tracks the ``homeassistant`` key in hacs.json, and each
      # pytest-homeassistant-custom-component release pins one exact Home
      # Assistant along with pytest, pytest-asyncio and pytest-cov.
      - dependency-name: "homeassistant"
      - dependency-name: "pytest-homeassistant-custom-component"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
