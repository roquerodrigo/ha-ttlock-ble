name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Before opening, search the [existing issues](https://github.com/roquerodrigo/ha-ttlock-ble/issues?q=is%3Aissue) for the same idea.
        Suggest one feature per issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, device model, links or anything else that helps.
