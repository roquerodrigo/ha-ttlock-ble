name: Release

# Gated on a successful CI run rather than on the push itself. The
# `workflow_run.event == 'push'` half of the condition is what stops a pull
# request with green CI from cutting a release.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
    uses: roquerodrigo/workflows/.github/workflows/release-please.yml@main
    secrets:
      release-token: ${{ secrets.RELEASE_PLEASE_PAT }}

  publish:
    needs: release
    if: needs.release.outputs.release-created == 'true'
    permissions:
      contents: write
    uses: roquerodrigo/workflows/.github/workflows/publish-hacs-zip.yml@main
    with:
      domain: ttlock_ble
      ref: ${{ needs.release.outputs.tag-name }}
