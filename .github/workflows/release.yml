name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
    uses: roquerodrigo/.github/.github/workflows/ha-release.yml@v3
    secrets: inherit
