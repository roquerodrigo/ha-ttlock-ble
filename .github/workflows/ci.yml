name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    uses: roquerodrigo/.github/.github/workflows/ha-lint.yml@v3

  tests:
    needs: lint
    uses: roquerodrigo/.github/.github/workflows/ha-tests.yml@v3

  validate:
    needs: lint
    uses: roquerodrigo/.github/.github/workflows/ha-validate.yml@v3

  update-pr-branch:
    if: github.event_name == 'pull_request'
    needs: [lint, tests, validate]
    permissions:
      contents: write
      pull-requests: write
    uses: roquerodrigo/.github/.github/workflows/ha-update-pr-branch.yml@v3
